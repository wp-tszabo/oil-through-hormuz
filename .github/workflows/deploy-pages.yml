name: Deploy site to GitHub Pages

# NOTE: GitHub Pages isn't available on this repo yet - it's private, and
# Pages for private repos needs a paid GitHub plan. The owner chose to stay
# private and defer hosting rather than upgrade or go public (see
# company-memory/decisions-log.md, 2026-09-16). Trigger is manual-only for
# now so this doesn't fail loudly on every push; switch back to the `push`
# trigger once a hosting decision is made (public repo, paid plan, or a
# different host like Vercel/Netlify - in which case this whole workflow
# would be swapped out).
on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
