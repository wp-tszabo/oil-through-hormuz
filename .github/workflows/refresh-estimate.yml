name: Refresh daily estimate

# The site headlines a DATED model estimate. A dated figure left unattended
# is stale data under GOVERNANCE.md critical-issue category 1 -- which is
# exactly what happened on 2026-09-18 (issue #7). This job is the durable fix.
#
# It is deliberately narrow. It re-dates the estimate, re-derives the band,
# re-anchors when EIA publishes a new quarter, and refuses to publish anything
# at all if the source fetch or parse fails, or if we are past the horizon the
# model has actually been back-tested over. It never touches prose: it writes
# only inside the <!-- GENERATED:estimate --> markers in site/index.html.

on:
  schedule:
    # 05:10 UTC daily -- after midnight everywhere that matters, so
    # "yesterday" is unambiguous for the reader.
    - cron: "10 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # Needed only to dispatch the Pages deploy -- see the last step for why a
  # plain push is not enough.
  actions: write

concurrency:
  group: refresh-estimate
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh the estimate
        # No `continue-on-error`, on purpose. If this step fails the run goes
        # red and the site keeps serving the last reviewed content. A loud
        # failure is the correct outcome; a quietly frozen date is not.
        run: python scripts/refresh_estimate.py

      - name: Commit if anything changed
        id: commit
        run: |
          set -euo pipefail
          # Stage BOTH paths the script can write: site/ (public) and
          # company-memory/shadow-predictions.jsonl (internal v2 band-gate
          # shadow log, methodology.md section 88.9 -- appended every run).
          # Root cause of the 2026-11-24 red run (run 45429633905) and of
          # several days of silently-dropped shadow-log lines before it:
          # only site/ was staged here, so shadow-predictions.jsonl was left
          # as an unstaged change on a tracked file. On a day `git pull
          # --rebase` actually had something to rebase, that dirty worktree
          # made the rebase fail outright ("cannot pull with rebase: You
          # have unstaged changes"), and the push -- with it the whole
          # commit -- never happened, even though the commit step itself had
          # already succeeded against the local branch. On a day there was
          # nothing to rebase, git short-circuited, the job reported
          # success, and the unstaged shadow-log line was discarded when the
          # runner was torn down. Staging both paths here, and separately
          # tracking whether site/ itself changed, fixes both failure modes
          # while keeping the Pages deploy dispatch gated on site/ actually
          # changing (no point deploying when nothing public moved).
          git add site/ company-memory/shadow-predictions.jsonl
          if git diff --cached --quiet -- site/; then
            echo "site_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --cached --quiet; then
            echo "No change to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name  "hormuz-refresh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh daily estimate ($(date -u +%Y-%m-%d))

          Automated refresh of the model estimate. Values derive only from
          licence-cleared EIA sources (Global Energy Security Data supplement
          and Short-Term Energy Outlook Table 3d); no prose was changed. See
          scripts/refresh_estimate.py and company-memory/methodology.md."
          # A cycle may have pushed company-memory to main since checkout.
          # Rebase rather than fail on a race; a real conflict still fails loudly.
          git pull --rebase origin main
          git push

      - name: Deploy the refreshed page
        # Without this step the whole job is a no-op as far as readers are
        # concerned. GitHub's documented rule: "Events triggered by the
        # GITHUB_TOKEN will not create a new workflow run, with the following
        # exceptions: workflow_dispatch and repository_dispatch." So the push
        # above does NOT fire deploy-pages.yml -- the repo would look fresh
        # while the live page stayed frozen, i.e. the exact defect of critical
        # issue #7, only harder to notice. Dispatching the deploy explicitly
        # is the documented exception. No `continue-on-error`: if the deploy
        # cannot be dispatched, the run must go red.
        #
        # --retry: GitHub's dispatch API occasionally returns a transient 500
        # even though the dispatch itself went through (seen on run
        # 38253354506, 2026-10-12). Retry a handful of times with backoff to
        # ride out that flakiness; if it's a real, persistent failure the
        # retries still exhaust and curl still exits non-zero, so the job
        # still goes red exactly as designed.
        if: steps.commit.outputs.site_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS --fail-with-body -X POST \
            --retry 5 --retry-delay 5 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Pages deploy dispatched."
