name: Refresh daily estimate

# The site headlines a DATED model estimate. A dated figure left unattended
# is stale data under GOVERNANCE.md critical-issue category 1 -- which is
# exactly what happened on 2026-09-18 (issue #7). This job is the durable fix.
#
# It is deliberately narrow. It re-dates the estimate, re-derives the band,
# re-anchors when EIA publishes a new quarter, and refuses to publish anything
# at all if the source fetch or parse fails, or if we are past the horizon the
# model has actually been back-tested over. It never touches prose: it writes
# only inside the <!-- GENERATED:estimate --> markers in site/index.html.

on:
  schedule:
    # 05:10 UTC daily -- after midnight everywhere that matters, so
    # "yesterday" is unambiguous for the reader.
    - cron: "10 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # Needed only to dispatch the Pages deploy -- see the last step for why a
  # plain push is not enough.
  actions: write

concurrency:
  group: refresh-estimate
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh the estimate
        # No `continue-on-error`, on purpose. If this step fails the run goes
        # red and the site keeps serving the last reviewed content. A loud
        # failure is the correct outcome; a quietly frozen date is not.
        run: python scripts/refresh_estimate.py

      - name: Commit if anything changed
        id: commit
        run: |
          set -euo pipefail
          if git diff --quiet -- site/; then
            echo "No change to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name  "hormuz-refresh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/
          git commit -m "Refresh daily estimate ($(date -u +%Y-%m-%d))

          Automated re-date of the model estimate. Values derive only from the
          licence-cleared EIA Global Energy Security Data supplement; no prose
          was changed. See scripts/refresh_estimate.py and
          company-memory/methodology.md."
          # A cycle may have pushed company-memory to main since checkout.
          # Rebase rather than fail on a race; a real conflict still fails loudly.
          git pull --rebase origin main
          git push

      - name: Deploy the refreshed page
        # Without this step the whole job is a no-op as far as readers are
        # concerned. GitHub's documented rule: "Events triggered by the
        # GITHUB_TOKEN will not create a new workflow run, with the following
        # exceptions: workflow_dispatch and repository_dispatch." So the push
        # above does NOT fire deploy-pages.yml -- the repo would look fresh
        # while the live page stayed frozen, i.e. the exact defect of critical
        # issue #7, only harder to notice. Dispatching the deploy explicitly
        # is the documented exception. No `continue-on-error`: if the deploy
        # cannot be dispatched, the run must go red.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Pages deploy dispatched."
